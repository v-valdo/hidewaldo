<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="media/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="media/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="media/favicon-16x16.png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e0c4ce" />
    <title>hide waldo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background-color: #e0c4ce;
        font-family: Arial, sans-serif;
        padding: 40px 20px;
        color: #4a4a4a;
        font-size: 13px;
        line-height: 1.4;
        position: relative;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        font-smooth: never;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .bg-image {
        position: fixed;
        inset: 0;
        background-image: url("media/hwc2.jpg");
        background-size: cover;
        background-position: center;
        z-index: -2;
      }

      .bg-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(212, 180, 192, 0.84);
        z-index: -1;
      }

      .container {
        max-width: 500px;
        margin: 0 auto;
        text-align: center;
      }

      h1 {
        font-size: 15px;
        font-weight: 400;
        margin-bottom: 30px;
        letter-spacing: 1px;
      }

      .links-container {
        background-color: #ffffff;
        border: 1px solid #4a4a4a;
        width: 400px;
        max-width: 90%;
        margin: 0 auto;
        transition: all 0.2s ease-out;
      }

      .links-header {
        background-color: #d4d0c8;
        padding: 4px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #4a4a4a;
      }

      .window-title {
        font-size: 11px;
        font-weight: normal;
        letter-spacing: 1px;
      }

      .minimize {
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 0 6px;
        font-weight: bold;
      }

      .minimize:hover {
        background-color: #b0b0b0;
      }

      .minimize::before {
        content: "\2212";
      }

      .links-container.minimized .minimize {
        display: none;
      }

      .links-container.minimized .links-header:hover {
        background-color: #b8b4ac;
      }

      .links-container.minimized {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%) scale(0.95);
        width: 200px;
        z-index: 1;
        animation: minimizeWindow 0.2s ease-out;
      }

      @keyframes minimizeWindow {
        0% {
          opacity: 1;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 0.7;
          transform: translateX(-50%) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) scale(0.95);
        }
      }

      .links-container.minimized .links-table {
        display: none;
      }

      .links-container.minimized .links-table {
        display: none;
      }

      .links-container.minimized .links-header {
        cursor: pointer;
      }

      .links-table {
        margin: 0;
        width: 100%;
        border-collapse: collapse;
        border: none;
        padding: 20px;
        transition: opacity 0.3s ease;
      }

      .links-container.minimized .links-table {
        opacity: 0;
        pointer-events: none;
      }

      .links-table td {
        padding: 10px 15px;
      }

      .links-table td:first-child,
      .links-table td:last-child {
        opacity: 0.5;
        width: 30px;
      }

      a {
        color: #0000ee;
        text-decoration: none;
        display: inline-block;
        transition: filter 0.3s ease;
      }

      @media (hover: hover) {
        a:hover {
          filter: blur(1px);
        }
      }

      .hidden-text {
        position: fixed;
        bottom: 10px;
        left: 10px;
        font-size: 12px;
        opacity: 0.45;
        letter-spacing: 2px;
        cursor: pointer;
      }

      .hidden-gif {
        position: fixed;
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, 50%);
        opacity: 0;
        pointer-events: none;
        width: 60px;
        height: 60px;
      }

      .hidden-gif.show {
        opacity: 0.6;
        pointer-events: auto;
        cursor: pointer;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
        background-color: transparent;
      }

      .modal-content {
        background-color: #ffffff;
        border: 1px solid #4a4a4a;
        width: 400px;
        max-width: 90%;
      }

      .modal-header {
        background-color: #d4d0c8;
        padding: 4px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #4a4a4a;
      }

      .modal-title {
        font-size: 11px;
      }

      .close {
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 0 6px;
        font-weight: bold;
      }

      .close:hover {
        background-color: #b0b0b0;
      }

      .modal-body {
        padding: 20px;
        font-size: 12px;
        line-height: 1.6;
      }

      .modal-body p {
        margin-bottom: 10px;
      }

      .grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.05;
      }
    </style>
  </head>
  <body>
    <canvas class="grain" id="grain"></canvas>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="container">
      <div class="links-container" id="linksWindow">
        <div class="links-header" onclick="restoreWindow()">
          <span class="window-title">hide waldo 2026</span>
          <span class="minimize" onclick="minimizeWindow(event)"></span>
        </div>
        <table class="links-table">
          <tr>
            <td>~</td>
            <td>
              <a
                href="https://open.spotify.com/artist/7G4Fsp2wsfpic7VX867NQH"
                target="_blank"
                >( ♪ spotify )</a
              >
            </td>
            <td>~</td>
          </tr>
          <tr>
            <td>~</td>
            <td>
              <a href="https://www.instagram.com/hidewaldo" target="_blank"
                >( ◎ instagram )</a
              >
            </td>
            <td>~</td>
          </tr>
          <tr>
            <td>~</td>
            <td>
              <a href="https://www.twitch.tv/hidewaldo" target="_blank"
                >( ▣ twitch )</a
              >
            </td>
            <td>~</td>
          </tr>
          <tr>
            <td>~</td>
            <td>
              <a
                href="#"
                onclick="
                  openAbout();
                  return false;
                "
                >( ✉ about )</a
              >
            </td>
            <td>~</td>
          </tr>
        </table>
      </div>
    </div>

    <div class="hidden-text" onclick="openElsewhere()">elsewhere</div>

    <img
      src="media/HANDS2.GIF"
      alt=""
      class="hidden-gif"
      id="hiddenGif"
      onclick="openHands()"
    />

    <!-- About Modal -->
    <div id="aboutModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">about</span>
          <span class="close" onclick="closeAbout()">&times;</span>
        </div>
        <div class="modal-body">
          <p>hide waldo is a swedish multi genre artist</p>
          <p>business inquiries — contact@hidewaldo.com</p>
        </div>
      </div>
    </div>

    <!-- Elsewhere Modal -->
    <div id="elsewhereModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">elsewhere</span>
          <span class="close" onclick="closeElsewhere()">&times;</span>
        </div>
        <div class="modal-body">
          <img src="media/hwelsewhere.jpg" alt="" style="max-width: 100%" />
        </div>
      </div>
    </div>

    <!-- Hands Modal -->
    <div id="handsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">it's ok to disassociate</span>
          <span class="close" onclick="closeHands()">&times;</span>
        </div>
        <div class="modal-body">
          <img src="media/hand.jpg" alt="" style="max-width: 100%" />
        </div>
      </div>
    </div>

    <script>
      function openAbout() {
        document.getElementById("aboutModal").style.display = "flex";
      }

      function closeAbout() {
        document.getElementById("aboutModal").style.display = "none";
      }

      function openElsewhere() {
        document.getElementById("elsewhereModal").style.display = "flex";
      }

      function closeElsewhere() {
        document.getElementById("elsewhereModal").style.display = "none";
      }

      function openHands() {
        document.getElementById("handsModal").style.display = "flex";
      }

      function closeHands() {
        document.getElementById("handsModal").style.display = "none";
      }

      function minimizeWindow(event) {
        event.stopPropagation();
        document.getElementById("linksWindow").classList.add("minimized");
        document.getElementById("hiddenGif").classList.add("show");
      }

      function restoreWindow() {
        document.getElementById("linksWindow").classList.remove("minimized");
        document.getElementById("hiddenGif").classList.remove("show");
      }

      // animated grain
      const grainCanvas = document.getElementById("grain");
      const ctx = grainCanvas.getContext("2d");

      function resizeGrain() {
        grainCanvas.width = window.innerWidth;
        grainCanvas.height = window.innerHeight;
      }

      function generateNoise() {
        const imageData = ctx.createImageData(
          grainCanvas.width,
          grainCanvas.height,
        );
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 255;
          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
          data[i + 3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      function animateGrain() {
        generateNoise();
        requestAnimationFrame(animateGrain);
      }

      window.addEventListener("resize", resizeGrain);
      resizeGrain();
      animateGrain();
    </script>
  </body>
</html>
